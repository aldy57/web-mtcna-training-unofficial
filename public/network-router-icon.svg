<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="Logo Jaringan">
  <!-- Router Body / Chassis -->
  <rect x="6" y="24" width="36" height="15" rx="3.5" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />
  
  <!-- LED Status Indicators -->
  <circle cx="12" cy="31.5" r="1.75" fill="#38bdf8" />
  <circle cx="17.5" cy="31.5" r="1.75" fill="#38bdf8" />
  <circle cx="23" cy="31.5" r="1.75" fill="#38bdf8" />
  
  <!-- Network / Ethernet Ports Grid Lines -->
  <rect x="29" y="29.5" width="4" height="4" rx="1" fill="#334155" />
  <rect x="35" y="29.5" width="4" height="4" rx="1" fill="#334155" />
  
  <!-- Antennas -->
  <!-- Left Antenna -->
  <line x1="13" y1="24" x2="13" y2="12" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="13" cy="11" r="1.5" fill="#0284c7" />
  
  <!-- Right Antenna -->
  <line x1="35" y1="24" x2="35" y2="12" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="35" cy="11" r="1.5" fill="#0284c7" />
  
  <!-- Center Antenna -->
  <line x1="24" y1="24" x2="24" y2="9" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="8" r="1.5" fill="#0284c7" />

  <!-- Wireless / Network Waves / AI Signal -->
  <path d="M19 14.5C20.5 13 21.8 12.2 24 12.2C26.2 12.2 27.5 13 29 14.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M15.5 10.5C18 8 20.8 7 24 7C27.2 7 30 8 32.5 10.5" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  
  <!-- Network Node Connection Line below -->
  <line x1="12" y1="39" x2="12" y2="43" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="39" x2="36" y2="43" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
</svg>

