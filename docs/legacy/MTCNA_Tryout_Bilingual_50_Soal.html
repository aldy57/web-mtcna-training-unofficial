<style>
:root{color-scheme:light;--ink:#202124;--sub:#686b70;--line:#dadce0;--bg:#fff;--soft:#f6f7f8;--selected:#eaf0f7;--accent:#263e56}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}header{max-width:900px;margin:auto;padding:25px 30px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:650;letter-spacing:.03em}.edition{font-size:12px;color:var(--sub)}main{max-width:830px;margin:45px auto;padding:0 30px 55px}h1{font-size:27px;font-weight:600;line-height:1.35;margin:0 0 12px}h2{font-size:20px;font-weight:600;line-height:1.5;margin:12px 0 20px}h3{font-size:17px}p{margin:10px 0 22px}.muted{color:var(--sub);font-size:14px}.eyebrow{color:var(--sub);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.stack{display:grid;gap:10px;margin:24px 0}.choice{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px 25px;min-height:45px;color:#56595d;font:600 14px/1.5 system-ui;cursor:pointer;text-align:center}.choice:hover{background:var(--soft);border-color:#a6a9ad}.choice:focus-visible,button:focus-visible{outline:3px solid #6696c7;outline-offset:3px}.choice.option{text-align:left;padding:14px 24px;color:var(--ink);font-weight:400}.choice[aria-pressed=true]{background:var(--selected);border:2px solid var(--accent);padding:13px 23px}.choice:disabled{cursor:default;opacity:.85}.key{display:inline-block;min-width:27px;font-weight:600}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:22px;padding:9px 18px;font:500 14px/1.5 system-ui;cursor:pointer}.btn:hover{background:var(--soft)}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#354f69}.btn:disabled{opacity:.4;cursor:default}.meta{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--sub);margin-bottom:12px}.track{height:4px;background:#eee;margin-bottom:28px;border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--accent)}.notice{padding:17px 20px;border-radius:12px;background:var(--soft);margin:20px 0;font-size:14px}.notice p{margin:8px 0}.message{min-height:25px;font-size:14px;color:#734016}.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(50px,1fr));gap:8px}.num{border:1px solid var(--line);border-radius:10px;padding:10px 4px;background:white;cursor:pointer;font:14px system-ui}.num.done{background:var(--selected)}.num.marked{border:2px solid #9c7430}.score{font-size:64px;line-height:1.2;font-weight:600;letter-spacing:-.04em;margin:14px 0 18px;color:var(--accent)}.stats{display:flex;gap:25px;flex-wrap:wrap;margin:15px 0 28px}.stats strong{display:block;font-size:22px}.stats span{color:var(--sub);font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px;margin:15px 0}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}th{font-weight:600}.review{padding:20px 0;border-bottom:1px solid #eee}.review p{margin:8px 0}.sources a{color:var(--accent);font-size:13px}footer{max-width:830px;padding:20px 30px;margin:auto;color:var(--sub);font-size:12px;border-top:1px solid #eee}#clock{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}.notice.caution{border:1px solid #e6c983;background:#fff8e8;color:#654713}.notice.caution strong{color:#63471a}.language-note{color:#375b43;font-weight:600}.badge{display:inline-block;font-size:12px;font-weight:650;padding:3px 10px;border-radius:20px;color:#25573b;background:#e5f4e9;margin-left:7px}.choice.language{border-radius:14px;padding:17px 22px;text-align:left;display:block;color:var(--ink)}.choice.language small{display:block;font-weight:400;font-size:13px;color:var(--sub);margin-top:3px}.choice.language .badge{vertical-align:middle}.choice.language:focus-visible{outline:3px solid #6696c7;outline-offset:3px}@media(max-width:520px){header{padding:18px 20px}main{padding:0 20px 35px;margin-top:30px}h1{font-size:23px}.choice.option{border-radius:18px;padding:13px 17px}.choice[aria-pressed=true]{padding:12px 16px}.stats{gap:20px}.score{font-size:54px}footer{padding:20px}.edition{max-width:140px}th,td{padding:9px 5px}}
</style></head>
<body><header><div><div class="brand">LATIHAN MTCNA</div><div class="edition">2 bahasa · 50 soal per bahasa</div></div><div id="clock" aria-live="off"></div></header><main id="app"></main><footer>Simulasi independen dengan soal latihan orisinal, bukan soal resmi atau salinan ujian sertifikasi MikroTik. Pahami konsep dan praktik, bukan hanya menghafal jawaban. Sesi berjalan di halaman ini; memuat ulang atau menutup halaman menghapus sesi.</footer>
<script id="bank" type="application/json">[{"id": "A01", "topik": "Dasar", "jenis": "tunggal", "soal": "PC dan router berada pada segmen Layer 2 yang sama. IP router belum diketahui, tetapi layanan MAC-WinBox diizinkan pada port tersebut. Cara akses yang paling sesuai adalah …", "opsi": {"A": "WebFig tanpa alamat tujuan", "B": "WinBox menggunakan MAC address router", "C": "Telnet menggunakan SSID", "D": "SSH ke sembarang IP"}, "kunci": "B", "pembahasan": "MAC-WinBox memungkinkan akses melalui MAC address pada segmen Layer 2 yang sesuai. SSH dan WebFig memerlukan konektivitas IP.", "sumber": "S03"}, {"id": "A02", "topik": "Dasar", "jenis": "tunggal", "soal": "Berapa jumlah alamat host yang dapat digunakan pada subnet IPv4 /27 konvensional, setelah alamat network dan broadcast dikecualikan?", "opsi": {"A": "28", "B": "32", "C": "30", "D": "16"}, "kunci": "C", "pembahasan": "Tersisa 5 bit host: 2^5 = 32 alamat. Setelah dikurangi network dan broadcast, tersedia 30 alamat host.", "sumber": "S04"}, {"id": "A03", "topik": "Dasar", "jenis": "tunggal", "soal": "Anda ingin memeriksa dan menyunting konfigurasi RouterOS sebagai teks sebelum mengadaptasinya ke router lain. Keluaran yang paling sesuai adalah …", "opsi": {"A": "File backup biner saja", "B": "Tangkapan layar penggunaan CPU", "C": "File paket .npk", "D": "File hasil export .rsc"}, "kunci": "D", "pembahasan": "Export menghasilkan skrip konfigurasi yang dapat diperiksa. Skrip tetap perlu disesuaikan dengan versi dan antarmuka tujuan; export bukan salinan lengkap seluruh data router.", "sumber": "S05"}, {"id": "A04", "topik": "Dasar", "jenis": "tunggal", "soal": "Apa tujuan Safe Mode saat administrator mengubah konfigurasi melalui sesi jarak jauh?", "opsi": {"A": "Membantu membatalkan perubahan ketika sesi Safe Mode terputus tidak normal", "B": "Mengaktifkan seluruh layanan manajemen", "C": "Membuat backup permanen setiap detik", "D": "Menghilangkan kebutuhan autentikasi"}, "kunci": "A", "pembahasan": "Safe Mode membantu pemulihan perubahan saat sesi berakhir tidak normal, selama masih dalam batas pencatatan Safe Mode. Ini tidak menggantikan backup.", "sumber": "S05"}, {"id": "A05", "topik": "DHCP", "jenis": "tunggal", "soal": "ISP menyediakan alamat WAN melalui DHCP. Router pelanggan harus menerima konfigurasi itu pada ether1. Fitur yang dipakai adalah …", "opsi": {"A": "DHCP Server pada ether1", "B": "DNS static pada ether1", "C": "Bridge filter pada ether1", "D": "DHCP Client pada ether1"}, "kunci": "D", "pembahasan": "DHCP Client menerima konfigurasi dari server ISP. DHCP Server justru membagikan konfigurasi kepada klien.", "sumber": "S06"}, {"id": "A06", "topik": "DHCP", "jenis": "jamak", "soal": "Pilih semua parameter yang lazim dapat diberikan DHCP IPv4 kepada klien.", "opsi": {"A": "Default gateway", "B": "DNS server", "C": "Password administrator RouterOS", "D": "Subnet mask"}, "kunci": "ABD", "pembahasan": "DHCP dapat menyediakan subnet mask, gateway, dan DNS. Password login administrator router bukan parameter konfigurasi jaringan klien tersebut.", "sumber": "S07"}, {"id": "A07", "topik": "DHCP", "jenis": "tunggal", "soal": "Klien dapat menjangkau IP server uji, tetapi permintaan resolusi nama gagal. Pemeriksaan awal paling sesuai adalah …", "opsi": {"A": "Menonaktifkan seluruh antarmuka router", "B": "Menghapus bridge LAN", "C": "Mengganti semua kabel secara bersamaan", "D": "Memeriksa alamat DNS klien dan keterjangkauan resolver"}, "kunci": "D", "pembahasan": "Gejala ini mengarahkan pemeriksaan awal pada DNS. Keberhasilan akses IP belum membuktikan bahwa nama domain dapat diterjemahkan menjadi alamat IP.", "sumber": "S08"}, {"id": "A08", "topik": "Bridge", "jenis": "tunggal", "soal": "ether2 dan ether3 akan menjadi bagian LAN Layer 2 yang sama tanpa segmentasi VLAN. Konfigurasi yang paling sesuai adalah …", "opsi": {"A": "Memasang DHCP Client pada setiap port saja", "B": "Membuat NAT di antara kedua port", "C": "Menambahkan keduanya sebagai port pada bridge yang sama", "D": "Membuat default route ke setiap port"}, "kunci": "C", "pembahasan": "Bridge menggabungkan port dalam jaringan Layer 2. NAT dan route tidak menggantikan fungsi switching ini.", "sumber": "S09"}, {"id": "A09", "topik": "Bridge", "jenis": "tunggal", "soal": "Dua switch memiliki sambungan redundan. Apa fungsi RSTP pada bridge yang mendukungnya?", "opsi": {"A": "Mengenkripsi semua frame", "B": "Mengganti DNS server", "C": "Membentuk topologi forwarding bebas loop Layer 2", "D": "Membagikan alamat IP"}, "kunci": "C", "pembahasan": "RSTP mengatur peran dan status port untuk mencegah loop sambil mempertahankan kemungkinan jalur cadangan.", "sumber": "S10"}, {"id": "A10", "topik": "Routing", "jenis": "tunggal", "soal": "Prefix (rentang alamat) tujuan yang menyatakan default route IPv4 adalah …", "opsi": {"A": "0.0.0.0/0", "B": "192.168.0.0/16", "C": "127.0.0.1/32", "D": "255.255.255.255/32"}, "kunci": "A", "pembahasan": "Prefix /0 mencakup semua alamat IPv4. Default route digunakan ketika tidak ada rute aktif dengan rentang alamat lebih khusus yang sesuai.", "sumber": "S11"}, {"id": "A11", "topik": "Routing", "jenis": "tunggal", "soal": "Dalam tabel routing yang sama terdapat rute aktif 10.40.0.0/16 melalui R1 dan 10.40.8.0/24 melalui R2. Tidak ada policy routing. Paket ke 10.40.8.25 mengikuti …", "opsi": {"A": "Keduanya selalu bergantian", "B": "R1 karena prefix lebih pendek", "C": "Rute yang dibuat terakhir", "D": "R2 karena /24 lebih spesifik"}, "kunci": "D", "pembahasan": "Pencarian rute memilih prefix yang paling spesifik dan cocok dengan alamat tujuan. Alamat tujuan termasuk 10.40.8.0/24.", "sumber": "S11"}, {"id": "A12", "topik": "Routing", "jenis": "tunggal", "soal": "R1 terhubung ke R2 melalui 172.20.0.1/30 dan 172.20.0.2/30. LAN 192.168.50.0/24 berada di belakang R2. Entri static route pada R1 yang tepat untuk LAN itu adalah …", "opsi": {"A": "dst-address=192.168.50.0/24 gateway=172.20.0.1", "B": "dst-address=127.0.0.0/8 gateway=172.20.0.2", "C": "dst-address=192.168.50.0/24 gateway=172.20.0.2", "D": "dst-address=172.20.0.0/30 gateway=192.168.50.0"}, "kunci": "C", "pembahasan": "Next hop (router berikutnya) adalah alamat R2 yang dapat dijangkau R1. Komunikasi dua arah juga memerlukan jalur balik dan izin firewall.", "sumber": "S11"}, {"id": "A13", "topik": "Wireless", "jenis": "tunggal", "soal": "Pada paket wireless lama (legacy wireless), perangkat dengan lisensi yang mendukung akan melayani beberapa station sebagai access point. Mode yang sesuai adalah …", "opsi": {"A": "ap-bridge", "B": "station", "C": "station-pseudobridge", "D": "alignment-only"}, "kunci": "A", "pembahasan": "Pada legacy wireless, ap-bridge melayani beberapa station. Jangan menyamakan nama mode ini dengan menu pada paket wifi baru.", "sumber": "S12"}, {"id": "A14", "topik": "Wireless", "jenis": "tunggal", "soal": "Pada paket wireless lama (legacy wireless), apa fungsi utama mode station?", "opsi": {"A": "Membuat NAT otomatis", "B": "Menjadi server DHCP", "C": "Menghubungkan radio sebagai klien ke access point", "D": "Menjadi AP untuk banyak klien"}, "kunci": "C", "pembahasan": "Mode station berperan sebagai klien wireless. Koneksi radio tidak otomatis menyediakan NAT atau layanan DHCP.", "sumber": "S13"}, {"id": "A15", "topik": "Wireless", "jenis": "tunggal", "soal": "AP dan klien yang menggunakan paket wireless lama (legacy wireless) mendukung WPA2-PSK. Pilihan konfigurasi keamanan link yang tepat adalah …", "opsi": {"A": "Menggunakan nama SSID sebagai satu-satunya pengaman", "B": "WPA2-PSK dengan AES/CCMP dan passphrase kuat", "C": "Menggunakan WEP karena setara dengan WPA2", "D": "Menonaktifkan autentikasi karena SSID disembunyikan"}, "kunci": "B", "pembahasan": "WPA2-PSK dengan AES/CCMP menyediakan autentikasi dan enkripsi sesuai kemampuan perangkat pada soal. Menyembunyikan SSID tidak menggantikan perlindungan koneksi wireless.", "sumber": "S12"}, {"id": "A16", "topik": "Firewall", "jenis": "tunggal", "soal": "Paket dari PC menuju layanan WinBox pada IP router itu sendiri. Chain (jalur pemeriksaan) IPv4 firewall filter yang relevan adalah …", "opsi": {"A": "input", "B": "output", "C": "srcnat", "D": "forward"}, "kunci": "A", "pembahasan": "Input memproses paket yang ditujukan ke router. Forward memproses paket transit, sedangkan output untuk paket buatan router.", "sumber": "S14"}, {"id": "A17", "topik": "Firewall", "jenis": "tunggal", "soal": "Paket IPv4 diteruskan dari PC LAN melalui router menuju server Internet. Chain (jalur pemeriksaan) firewall filter untuk paket transit tersebut adalah …", "opsi": {"A": "input", "B": "dstnat", "C": "forward", "D": "output"}, "kunci": "C", "pembahasan": "Forward menangani paket yang melintas melalui router. Dstnat merupakan chain NAT, bukan chain filter untuk pertanyaan ini.", "sumber": "S14"}, {"id": "A18", "topik": "Firewall", "jenis": "tunggal", "soal": "LAN memakai IPv4 privat dan ISP tidak memiliki rute balik ke LAN tersebut. IP WAN dinamis. Setelah routing benar, aksi source NAT yang lazim dipilih adalah …", "opsi": {"A": "dst-nat", "B": "mark-packet", "C": "masquerade", "D": "redirect"}, "kunci": "C", "pembahasan": "Masquerade menyesuaikan source NAT dengan alamat antarmuka keluar, sehingga sesuai untuk WAN dinamis. Routing dan firewall tetap harus benar.", "sumber": "S15"}, {"id": "A19", "topik": "Firewall", "jenis": "tunggal", "soal": "Dalam chain forward, rule pertama menerima semua paket dari 192.168.10.0/24. Rule kedua menjatuhkan TCP port 80 dari subnet itu. Untuk koneksi baru dari subnet tersebut ke TCP port 80, tanpa rule lain sebelumnya, hasilnya …", "opsi": {"A": "Diterima oleh rule pertama", "B": "Dijatuhkan oleh rule kedua", "C": "Kedua aksi selalu dijalankan", "D": "Router otomatis mengurutkan ulang rule"}, "kunci": "A", "pembahasan": "Aksi accept mengakhiri pemeriksaan paket pada chain itu. Rule drop yang terletak setelah accept yang sudah cocok tidak tercapai.", "sumber": "S16"}, {"id": "A20", "topik": "QoS", "jenis": "tunggal", "soal": "Simple Queue memiliki target 192.168.10.25/32 dan max-limit=2M/8M. Burst tidak aktif dan trafik melewati queue. Batas dari sudut pandang target adalah …", "opsi": {"A": "Upload 8 Mbps dan download 2 Mbps", "B": "Upload dan download masing-masing 8 Mbps", "C": "Total gabungan selalu 10 Mbps", "D": "Upload 2 Mbps dan download 8 Mbps"}, "kunci": "D", "pembahasan": "Urutan max-limit Simple Queue adalah upload/download terhadap target. Nilai batas tidak menjamin kecepatan selalu tercapai.", "sumber": "S17"}, {"id": "A21", "topik": "QoS", "jenis": "tunggal", "soal": "Simple Queue sudah benar, tetapi koneksi klien terkena FastTrack dan pembatasan tidak berjalan sesuai harapan. Penyebab yang perlu diperiksa adalah …", "opsi": {"A": "DNS mengubah nilai max-limit", "B": "Trafik FastTrack dapat melewati Simple Queue", "C": "Nama queue harus sama dengan SSID", "D": "Lease DHCP selalu menonaktifkan queue"}, "kunci": "B", "pembahasan": "FastTrack dapat melewati Simple Queue. Periksa pengecualian FastTrack bagi trafik yang perlu dibatasi.", "sumber": "S18"}, {"id": "A22", "topik": "Tunnel", "jenis": "tunggal", "soal": "ISP mewajibkan username dan password PPPoE pada link Ethernet pelanggan. Fitur di router pelanggan yang digunakan adalah …", "opsi": {"A": "PPPoE Server", "B": "DHCP Relay", "C": "EoIP Server", "D": "PPPoE Client"}, "kunci": "D", "pembahasan": "PPPoE Client membangun sesi ke access concentrator ISP menggunakan kredensial yang diberikan.", "sumber": "S19"}, {"id": "A23", "topik": "Tunnel", "jenis": "jamak", "soal": "Dua router memiliki konektivitas IP dan ingin membawa frame Ethernet melalui tunnel EoIP. Pilih semua pernyataan yang benar.", "opsi": {"A": "EoIP menggantikan kebutuhan konektivitas IP antarkedua ujung", "B": "Tunnel ID kedua ujung untuk pasangan tunnel harus sesuai", "C": "EoIP membawa frame Ethernet melalui jaringan IP", "D": "EoIP saja selalu mengenkripsi seluruh trafik"}, "kunci": "BC", "pembahasan": "EoIP menyediakan tunnel Ethernet di atas IP dan pasangan ujung menggunakan tunnel ID yang cocok. Enkripsi memerlukan mekanisme tambahan; konektivitas IP tetap diperlukan.", "sumber": "S20"}, {"id": "A24", "topik": "Tools", "jenis": "tunggal", "soal": "Anda ingin melihat alamat sumber/tujuan dan laju trafik yang teramati pada sebuah interface secara langsung. Tool yang sesuai adalah …", "opsi": {"A": "Netinstall", "B": "System Identity", "C": "Torch", "D": "IP Pool"}, "kunci": "C", "pembahasan": "Torch menampilkan trafik yang teramati pada interface secara real time. Sebagian trafik mungkin tidak terlihat jika diproses langsung oleh perangkat keras (hardware offload).", "sumber": "S21"}, {"id": "A25", "topik": "Tools", "jenis": "tunggal", "soal": "Traceroute dipakai untuk …", "opsi": {"A": "Menyelidiki hop Layer 3 menuju tujuan dan respons waktunya", "B": "Mengubah seluruh MAC address", "C": "Membagikan DNS kepada klien", "D": "Membuat backup biner"}, "kunci": "A", "pembahasan": "Traceroute membantu menelusuri jalur Layer 3. Hop yang tidak menjawab tidak selalu berarti hop tersebut gagal meneruskan trafik.", "sumber": "S22"}, {"id": "B01", "topik": "Dasar", "jenis": "tunggal", "soal": "Host memiliki IPv4 192.168.70.130/26. Network address subnet host tersebut adalah …", "opsi": {"A": "192.168.70.64", "B": "192.168.70.128", "C": "192.168.70.0", "D": "192.168.70.192"}, "kunci": "B", "pembahasan": "Ukuran blok /26 adalah 64 alamat. Alamat .130 berada pada blok .128 sampai .191, sehingga network-nya .128.", "sumber": "S04"}, {"id": "B02", "topik": "Dasar", "jenis": "tunggal", "soal": "Dalam LAN IPv4 Ethernet, fungsi utama ARP adalah …", "opsi": {"A": "Menerjemahkan nama domain menjadi IP", "B": "Memilih default route Internet", "C": "Mengalokasikan subnet mask melalui lease", "D": "Memetakan alamat IPv4 tetangga ke MAC address"}, "kunci": "D", "pembahasan": "ARP menyelesaikan alamat IPv4 tetangga menjadi MAC address untuk pengiriman pada link lokal. Resolusi nama adalah fungsi DNS.", "sumber": "S23"}, {"id": "B03", "topik": "Dasar", "jenis": "jamak", "soal": "Pilih semua pernyataan yang benar mengenai pengelolaan konfigurasi RouterOS.", "opsi": {"A": "Hasil export selalu memuat seluruh data dan rahasia tanpa pengecualian", "B": "File .npk adalah format export konfigurasi yang dapat diedit", "C": "Export .rsc dapat diperiksa sebagai teks", "D": "Backup biner dan export teks memiliki tujuan serta cakupan yang berbeda"}, "kunci": "CD", "pembahasan": "Export adalah skrip teks; backup biner memiliki cakupan dan karakteristik berbeda. Jangan berasumsi export memuat seluruh data atau informasi sensitif.", "sumber": "S05"}, {"id": "B04", "topik": "Dasar", "jenis": "tunggal", "soal": "Untuk lisensi RouterOS klasik, bukan skema CHR, level minimum berbayar dari pilihan berikut yang mendukung legacy wireless AP point-to-multipoint adalah …", "opsi": {"A": "Level 1", "B": "Semua level memiliki kemampuan sama", "C": "Level 3", "D": "Level 4"}, "kunci": "D", "pembahasan": "Level 4 mendukung mode AP PtMP pada skema lisensi klasik. Level 3 ditujukan untuk station/CPE. Hardware dan paket wireless juga harus mendukung.", "sumber": "S24"}, {"id": "B05", "topik": "DHCP", "jenis": "tunggal", "soal": "LAN 192.168.30.0/24 memakai gateway 192.168.30.1 dan server statis 192.168.30.10. Pool DHCP yang menghindari kedua alamat tersebut, network, dan broadcast adalah …", "opsi": {"A": "192.168.30.1-192.168.30.100", "B": "192.168.30.10-192.168.30.255", "C": "192.168.30.0-192.168.30.254", "D": "192.168.30.100-192.168.30.200"}, "kunci": "D", "pembahasan": "Rentang .100 sampai .200 berada dalam subnet dan tidak mencakup alamat yang sudah dicadangkan maupun network/broadcast.", "sumber": "S25"}, {"id": "B06", "topik": "DHCP", "jenis": "tunggal", "soal": "Klien memakai IP router sebagai DNS. Upstream DNS router sudah bekerja dan firewall mengizinkan DNS dari LAN. Pengaturan RouterOS yang diperlukan agar router menjawab permintaan DNS klien adalah …", "opsi": {"A": "allow-remote-requests=yes", "B": "add-default-route=no", "C": "arp=disabled", "D": "use-peer-dns=no pada semua interface"}, "kunci": "A", "pembahasan": "Allow-remote-requests memungkinkan router melayani kueri DNS klien. Akses resolver perlu dibatasi ke jaringan yang diizinkan.", "sumber": "S08"}, {"id": "B07", "topik": "DHCP", "jenis": "tunggal", "soal": "Pada DHCP Client RouterOS, use-peer-dns=yes berarti …", "opsi": {"A": "Router menjadi authoritative DNS untuk semua domain", "B": "Router menonaktifkan resolusi nama", "C": "Router menghapus seluruh static route", "D": "Router menerima informasi DNS yang diberikan DHCP server"}, "kunci": "D", "pembahasan": "Use-peer-dns mengizinkan penggunaan informasi DNS dari DHCP server. Ini berbeda dari izin menjawab kueri DNS klien LAN.", "sumber": "S06"}, {"id": "B08", "topik": "Bridge", "jenis": "tunggal", "soal": "ether2 dan ether3 merupakan port bridge-LAN tanpa VLAN. Alamat gateway LAN yang melayani kedua port sebaiknya ditempatkan pada …", "opsi": {"A": "bridge-LAN", "B": "ether2 dan ether3 dengan IP identik terpisah", "C": "Setiap MAC address klien", "D": "Interface WAN saja"}, "kunci": "A", "pembahasan": "Alamat Layer 3 untuk LAN ditempatkan pada interface bridge. Port anggota menyediakan jalur Layer 2 ke bridge itu.", "sumber": "S09"}, {"id": "B09", "topik": "Bridge", "jenis": "tunggal", "soal": "Bridge tanpa VLAN menerima frame unicast (data untuk satu tujuan). MAC tujuan telah dipelajari pada ether3. Frame datang dari ether2 dan ether3 berada dalam status forwarding. Perilaku normalnya adalah …", "opsi": {"A": "Mengirim frame ke semua port tanpa pengecualian", "B": "Menjatuhkan frame karena bukan broadcast", "C": "Meneruskan frame ke ether3", "D": "Mengubah frame menjadi paket DNS"}, "kunci": "C", "pembahasan": "Bridge memakai tabel MAC untuk meneruskan known unicast ke port tujuan yang sesuai. Flooding terutama berkaitan dengan tujuan yang belum dikenal atau trafik broadcast tertentu.", "sumber": "S09"}, {"id": "B10", "topik": "Routing", "jenis": "tunggal", "soal": "Dua static route unicast memiliki prefix tujuan yang sama dalam tabel yang sama. Keduanya memiliki next hop (router berikutnya) yang dapat dijangkau; distance masing-masing 1 dan 5. Tanpa kebijakan lain, rute yang diutamakan adalah …", "opsi": {"A": "Distance 5", "B": "Distance 1", "C": "Yang komentarnya paling panjang", "D": "Yang ditambahkan terakhir"}, "kunci": "B", "pembahasan": "Untuk kandidat dengan rentang alamat tujuan yang sama, distance lebih rendah lebih diutamakan. Ini berbeda dari pemilihan prefix paling spesifik saat lookup tujuan.", "sumber": "S11"}, {"id": "B11", "topik": "Routing", "jenis": "tunggal", "soal": "Router diberi IP 192.168.45.1/24 pada interface aktif dan running. Rute jaringan lokal yang biasanya terbentuk otomatis adalah …", "opsi": {"A": "Rute DNS ke 192.168.45.255", "B": "Connected route 192.168.45.0/24", "C": "Rute BGP ke seluruh Internet", "D": "Static default route ke Internet"}, "kunci": "B", "pembahasan": "Alamat pada interface aktif menghasilkan connected route (rute jaringan yang terhubung langsung) ke subnet tersebut. Akses Internet tetap memerlukan konfigurasi lain.", "sumber": "S11"}, {"id": "B12", "topik": "Routing", "jenis": "tunggal", "soal": "R1 sudah memiliki route ke LAN di belakang R2. Tanpa NAT, paket permintaan sampai ke host tujuan, tetapi host memakai gateway R2 dan R2 tidak punya rute ke jaringan asal. Perbaikan yang paling relevan adalah …", "opsi": {"A": "Menghapus seluruh route di R1", "B": "Mengubah SSID R1", "C": "Menghapus alamat IP host tujuan", "D": "Menambahkan jalur balik yang benar pada R2"}, "kunci": "D", "pembahasan": "Komunikasi dua arah memerlukan jalur kembali. Rute satu arah saja tidak cukup.", "sumber": "S11"}, {"id": "B13", "topik": "Wireless", "jenis": "tunggal", "soal": "Dua pengukuran sinyal diterima adalah -55 dBm dan -75 dBm. Pengukuran yang menunjukkan daya sinyal lebih kuat adalah …", "opsi": {"A": "Sama kuat karena keduanya negatif", "B": "-75 dBm", "C": "Tidak bisa dibandingkan dalam dBm", "D": "-55 dBm"}, "kunci": "D", "pembahasan": "Nilai -55 dBm lebih besar daripada -75 dBm, sehingga dayanya lebih kuat. Kualitas link tetap dipengaruhi noise dan faktor lain.", "sumber": "S12"}, {"id": "B14", "topik": "Wireless", "jenis": "tunggal", "soal": "AP berada pada 5 GHz, sedangkan radio klien hanya mendukung 2,4 GHz. Walaupun SSID dan password sama, klien …", "opsi": {"A": "Dapat terhubung jika IP dibuat statis", "B": "Tidak dapat terhubung langsung ke radio 5 GHz tersebut", "C": "Dapat terhubung jika DHCP dimatikan", "D": "Otomatis berubah menjadi radio 5 GHz"}, "kunci": "B", "pembahasan": "Radio harus mendukung band yang dipakai AP. Konfigurasi IP tidak mengubah kemampuan frekuensi perangkat.", "sumber": "S26"}, {"id": "B15", "topik": "Wireless", "jenis": "tunggal", "soal": "Pada paket wireless lama (legacy wireless), administrator ingin melihat station yang sedang terdaftar beserta informasi link pada AP. Menu yang sesuai adalah …", "opsi": {"A": "System Packages", "B": "IP Routes", "C": "Wireless Registration Table", "D": "IP Pool"}, "kunci": "C", "pembahasan": "Registration Table menampilkan peer wireless yang terdaftar beserta statistik link.", "sumber": "S12"}, {"id": "B16", "topik": "Firewall", "jenis": "tunggal", "soal": "Router sendiri membuat paket ICMP echo-request menuju server di jaringan lain. Chain (jalur pemeriksaan) IPv4 firewall filter yang relevan untuk paket keluar itu adalah …", "opsi": {"A": "dstnat", "B": "input", "C": "output", "D": "forward"}, "kunci": "C", "pembahasan": "Paket berasal dari proses pada router, sehingga melalui output. Paket dari host yang sekadar melewati router menggunakan forward.", "sumber": "S14"}, {"id": "B17", "topik": "Firewall", "jenis": "tunggal", "soal": "Sebuah koneksi baru tiba pada IP publik router TCP 8443 dan akan diteruskan ke server LAN 192.168.20.10 TCP 443. Jenis translasi yang diperlukan adalah …", "opsi": {"A": "Masquerade sumber saja", "B": "Mengubah TTL saja", "C": "DHCP relay", "D": "Destination NAT dengan perubahan port tujuan"}, "kunci": "D", "pembahasan": "Destination NAT mengubah tujuan ke server LAN, termasuk port bila ditentukan. Route, jalur balik, dan filter forward juga harus sesuai.", "sumber": "S15"}, {"id": "B18", "topik": "Firewall", "jenis": "jamak", "soal": "Pilih semua pernyataan benar tentang firewall IPv4 RouterOS.", "opsi": {"A": "connection-state=established digunakan untuk paket pada koneksi yang sudah terbentuk", "B": "Urutan rule dapat memengaruhi hasil pemrosesan", "C": "action=drop selalu mengirim pesan penolakan ke pengirim", "D": "NAT otomatis menggantikan seluruh kebijakan firewall filter"}, "kunci": "AB", "pembahasan": "Connection tracking mengenali status koneksi. Urutan rule berpengaruh; drop tidak memberi respons penolakan seperti reject, dan NAT bukan pengganti kebijakan filter.", "sumber": "S16,S18"}, {"id": "B19", "topik": "Firewall", "jenis": "tunggal", "soal": "Administrator mengubah rule NAT, tetapi pengujian memakai koneksi lama yang masih tercatat. Apa penjelasan yang paling sesuai jika translasi lama tetap terlihat?", "opsi": {"A": "Connection tracking dapat mempertahankan pemetaan NAT koneksi lama", "B": "Router tidak mendukung NAT", "C": "NAT hanya bekerja pada hari pertama", "D": "DNS selalu membatalkan rule NAT baru"}, "kunci": "A", "pembahasan": "Keputusan NAT disimpan dalam connection tracking. Uji koneksi baru atau kelola entri koneksi terkait secara terkontrol; jangan menyimpulkan rule baru gagal dari koneksi lama saja.", "sumber": "S15"}, {"id": "B20", "topik": "QoS", "jenis": "tunggal", "soal": "Dalam konfigurasi queue tanpa burst, parameter max-limit terutama menunjukkan …", "opsi": {"A": "Kecepatan minimum yang selalu dijamin ISP", "B": "Batas atas laju trafik queue", "C": "Jumlah maksimal klien DHCP", "D": "Ukuran penyimpanan router"}, "kunci": "B", "pembahasan": "Max-limit adalah batas maksimum queue, bukan jaminan bandwidth selalu tersedia. Kapasitas jalur dan kondisi jaringan tetap membatasi throughput.", "sumber": "S17"}, {"id": "B21", "topik": "QoS", "jenis": "tunggal", "soal": "Administrator ingin membatasi upload/download satu alamat IP klien dengan pengaturan sederhana. Fitur yang paling langsung sesuai adalah …", "opsi": {"A": "IP Neighbor Discovery", "B": "Simple Queue dengan target alamat klien", "C": "System Scheduler saja", "D": "DHCP Relay"}, "kunci": "B", "pembahasan": "Simple Queue mendukung pembatasan upload/download berdasarkan target. Trafik harus benar-benar melewati jalur queue tersebut.", "sumber": "S17"}, {"id": "B22", "topik": "Tunnel", "jenis": "tunggal", "soal": "Urutan fase utama PPPoE adalah …", "opsi": {"A": "NAT lalu DNS", "B": "ARP lalu HTTP", "C": "Session lalu Discovery", "D": "Discovery lalu Session"}, "kunci": "D", "pembahasan": "Pada fase Discovery, klien mencari server PPPoE dan menyiapkan sesi. Setelah itu, fase Session digunakan untuk menjalankan koneksi PPPoE.", "sumber": "S19"}, {"id": "B23", "topik": "Tunnel", "jenis": "tunggal", "soal": "Pada router yang memakai basis pengguna PPP lokal, tempat mendefinisikan username dan password akun PPP untuk autentikasi adalah …", "opsi": {"A": "System Identity", "B": "PPP Secret", "C": "Wireless Registration Table", "D": "IP Routes"}, "kunci": "B", "pembahasan": "PPP Secret menyimpan akun PPP lokal, termasuk username dan password. PPP Profile mengatur pengaturan layanan yang dapat digunakan akun tersebut.", "sumber": "S27"}, {"id": "B24", "topik": "Tools", "jenis": "tunggal", "soal": "Perintah ping ke sebuah IP mendapatkan balasan. Kesimpulan yang dapat diambil dari pengujian itu adalah …", "opsi": {"A": "Tujuan merespons ICMP pada saat pengujian", "B": "DNS pasti benar", "C": "Tidak ada kehilangan paket pada semua jalur Internet", "D": "Semua aplikasi pada tujuan pasti bekerja"}, "kunci": "A", "pembahasan": "Balasan ping menunjukkan respons ICMP dalam pengujian tersebut. Ini tidak membuktikan layanan aplikasi maupun DNS berfungsi.", "sumber": "S28"}, {"id": "B25", "topik": "Tools", "jenis": "tunggal", "soal": "Anda ingin menyimpan paket yang teramati pada router untuk dianalisis lebih lanjut di Wireshark. Tool yang paling sesuai adalah …", "opsi": {"A": "System Identity", "B": "DHCP Network", "C": "Packet Sniffer dengan keluaran capture", "D": "IP Service"}, "kunci": "C", "pembahasan": "Packet Sniffer dapat menangkap paket untuk analisis lebih rinci. Pastikan interface dan filter capture sesuai serta pahami batas visibilitas trafik yang di-offload.", "sumber": "S29"}]</script><script id="bank-en" type="application/json">{"A01":{"soal":"A PC and a router are on the same Layer 2 segment. The router's IP address is unknown, but the MAC-WinBox service is allowed on that port. Which access method is most appropriate?","opsi":{"A":"WebFig without a destination address","B":"WinBox using the router's MAC address","C":"Telnet using an SSID","D":"SSH to any arbitrary IP address"},"pembahasan":"MAC-WinBox allows access by MAC address on an appropriate Layer 2 segment. SSH and WebFig require IP connectivity."},"A02":{"soal":"How many usable host addresses are available in a conventional IPv4 /27 subnet after excluding the network and broadcast addresses?","opsi":{"A":"28","B":"32","C":"30","D":"16"},"pembahasan":"Five host bits remain: 2^5 = 32 addresses. After excluding the network and broadcast addresses, 30 usable host addresses remain."},"A03":{"soal":"You want to inspect and edit a RouterOS configuration as text before adapting it to another router. Which output is most suitable?","opsi":{"A":"A binary backup file only","B":"A screenshot of CPU usage","C":"An .npk package file","D":"An exported .rsc file"},"pembahasan":"Export creates a configuration script that can be inspected. The script still needs adjustments for the target version and interfaces; an export is not a complete copy of all router data."},"A04":{"soal":"What is the purpose of Safe Mode when an administrator changes configuration through a remote session?","opsi":{"A":"To help undo changes if the Safe Mode session disconnects abnormally","B":"To enable all management services","C":"To create a permanent backup every second","D":"To remove the need for authentication"},"pembahasan":"Safe Mode helps roll back changes if the session ends abnormally, subject to its change-history limits. It does not replace backups."},"A05":{"soal":"An ISP provides the WAN address using DHCP. The customer's router must obtain this configuration on ether1. Which feature should be used?","opsi":{"A":"DHCP Server on ether1","B":"Static DNS on ether1","C":"Bridge filter on ether1","D":"DHCP Client on ether1"},"pembahasan":"A DHCP Client receives configuration from the ISP's server. A DHCP Server instead distributes configuration to clients."},"A06":{"soal":"Select all parameters that IPv4 DHCP commonly provides to clients.","opsi":{"A":"Default gateway","B":"DNS server","C":"RouterOS administrator password","D":"Subnet mask"},"pembahasan":"DHCP can provide a subnet mask, default gateway, and DNS servers. The router administrator password is not one of these client network settings."},"A07":{"soal":"A client can reach a test server by IP address, but name resolution requests fail. What is the most appropriate initial check?","opsi":{"A":"Disable all router interfaces","B":"Remove the LAN bridge","C":"Replace all cables at once","D":"Check the client's DNS server address and reachability of the resolver"},"pembahasan":"This symptom points to DNS as an initial area to investigate. Successful IP connectivity does not prove that domain names can be resolved to IP addresses."},"A08":{"soal":"ether2 and ether3 need to belong to the same Layer 2 LAN without VLAN segmentation. Which configuration is most appropriate?","opsi":{"A":"Configure a DHCP Client on each port only","B":"Create NAT between the two ports","C":"Add both ports to the same bridge","D":"Create a default route through each port"},"pembahasan":"A bridge combines ports within a Layer 2 network. NAT and routing do not replace this switching function."},"A09":{"soal":"Two switches have redundant connections. What does RSTP do on bridges that support it?","opsi":{"A":"Encrypt all frames","B":"Replace the DNS server","C":"Establish a loop-free Layer 2 forwarding topology","D":"Assign IP addresses"},"pembahasan":"RSTP manages port roles and states to prevent loops while retaining the possibility of a backup path."},"A10":{"soal":"Which destination prefix represents the IPv4 default route?","opsi":{"A":"0.0.0.0/0","B":"192.168.0.0/16","C":"127.0.0.1/32","D":"255.255.255.255/32"},"pembahasan":"The /0 prefix covers all IPv4 addresses. The default route is used when no more-specific active matching route is available."},"A11":{"soal":"The same routing table contains an active route to 10.40.0.0/16 via R1 and another to 10.40.8.0/24 via R2. There is no policy routing. A packet destined for 10.40.8.25 uses ...","opsi":{"A":"Both routes alternately in every case","B":"R1 because its prefix is shorter","C":"The route created most recently","D":"R2 because /24 is more specific"},"pembahasan":"Route lookup selects the most-specific matching prefix. The destination belongs to 10.40.8.0/24."},"A12":{"soal":"R1 connects to R2 using 172.20.0.1/30 and 172.20.0.2/30. The 192.168.50.0/24 LAN is behind R2. Which static route on R1 correctly reaches that LAN?","opsi":{"A":"dst-address=192.168.50.0/24 gateway=172.20.0.1","B":"dst-address=127.0.0.0/8 gateway=172.20.0.2","C":"dst-address=192.168.50.0/24 gateway=172.20.0.2","D":"dst-address=172.20.0.0/30 gateway=192.168.50.0"},"pembahasan":"The next hop is R2's address, which R1 can reach. Two-way communication also requires a return path and appropriate firewall permissions."},"A13":{"soal":"With the legacy wireless package, a device with a suitable license will serve multiple stations as an access point. Which mode is appropriate?","opsi":{"A":"ap-bridge","B":"station","C":"station-pseudobridge","D":"alignment-only"},"pembahasan":"In legacy wireless, ap-bridge serves multiple stations. Do not confuse this mode name with options in the newer wifi package."},"A14":{"soal":"In the legacy wireless package, what is the primary function of station mode?","opsi":{"A":"Automatically create NAT","B":"Act as a DHCP server","C":"Connect the radio as a client to an access point","D":"Act as an AP for multiple clients"},"pembahasan":"Station mode makes the wireless radio act as a client. A wireless link does not automatically provide NAT or DHCP services."},"A15":{"soal":"An AP and its clients use the legacy wireless package and support WPA2-PSK. Which link security configuration is appropriate?","opsi":{"A":"Use the SSID name as the only protection","B":"WPA2-PSK with AES/CCMP and a strong passphrase","C":"Use WEP because it is equivalent to WPA2","D":"Disable authentication because the SSID is hidden"},"pembahasan":"WPA2-PSK with AES/CCMP provides authentication and encryption supported by the devices in this scenario. Hiding the SSID does not replace wireless security."},"A16":{"soal":"A packet travels from a PC to the WinBox service on the router's own IP address. Which IPv4 firewall filter chain applies?","opsi":{"A":"input","B":"output","C":"srcnat","D":"forward"},"pembahasan":"The input chain processes packets destined for the router itself. Forward handles transit packets, while output applies to packets generated by the router."},"A17":{"soal":"An IPv4 packet is forwarded from a LAN PC through a router to an Internet server. Which firewall filter chain handles this transit packet?","opsi":{"A":"input","B":"dstnat","C":"forward","D":"output"},"pembahasan":"Forward handles packets passing through a router. Dstnat is a NAT chain, not the filter chain asked about here."},"A18":{"soal":"A LAN uses private IPv4 addresses, and the ISP has no return route to that LAN. The WAN IP is dynamic. Once routing works, which source NAT action is commonly used?","opsi":{"A":"dst-nat","B":"mark-packet","C":"masquerade","D":"redirect"},"pembahasan":"Masquerade adapts source NAT to the outgoing interface address, making it suitable for a dynamic WAN IP. Routing and firewall rules must still be correct."},"A19":{"soal":"In the forward chain, the first rule accepts all packets from 192.168.10.0/24. The second rule drops TCP port 80 traffic from that subnet. For a new connection from that subnet to TCP port 80, with no earlier rules, what happens?","opsi":{"A":"It is accepted by the first rule","B":"It is dropped by the second rule","C":"Both actions are always executed","D":"The router automatically reorders the rules"},"pembahasan":"The accept action ends packet processing in that chain. A later drop rule is not reached if the earlier accept rule already matches."},"A20":{"soal":"A Simple Queue targets 192.168.10.25/32 with max-limit=2M/8M. Burst is disabled and the traffic passes through the queue. What limits apply from the target's perspective?","opsi":{"A":"8 Mbps upload and 2 Mbps download","B":"8 Mbps for both upload and download","C":"Always a combined total of 10 Mbps","D":"2 Mbps upload and 8 Mbps download"},"pembahasan":"Simple Queue max-limit values are ordered upload/download relative to the target. These limits do not guarantee that the specified speeds will be achieved."},"A21":{"soal":"A Simple Queue is configured correctly, but a client's connection uses FastTrack and bandwidth limiting does not work as expected. Which cause should be checked?","opsi":{"A":"DNS changes the max-limit value","B":"FastTrack traffic can bypass Simple Queues","C":"The queue name must match the SSID","D":"A DHCP lease always disables queues"},"pembahasan":"FastTrack traffic may bypass Simple Queues. Check FastTrack exclusions for traffic that must be limited."},"A22":{"soal":"An ISP requires a PPPoE username and password on the customer's Ethernet link. Which feature should be used on the customer's router?","opsi":{"A":"PPPoE Server","B":"DHCP Relay","C":"EoIP Server","D":"PPPoE Client"},"pembahasan":"A PPPoE Client establishes a session with the ISP's access concentrator using the supplied credentials."},"A23":{"soal":"Two routers have IP connectivity and want to carry Ethernet frames over an EoIP tunnel. Select all correct statements.","opsi":{"A":"EoIP eliminates the need for IP connectivity between the endpoints","B":"Both endpoints of a tunnel pair must use matching tunnel IDs","C":"EoIP carries Ethernet frames over an IP network","D":"EoIP alone always encrypts all traffic"},"pembahasan":"EoIP provides an Ethernet tunnel over IP, and its endpoints use matching tunnel IDs. Encryption requires an additional mechanism, and IP connectivity is still necessary."},"A24":{"soal":"You want to see observed source/destination addresses and live traffic rates on an interface. Which tool is appropriate?","opsi":{"A":"Netinstall","B":"System Identity","C":"Torch","D":"IP Pool"},"pembahasan":"Torch shows observed traffic on an interface in real time. Some traffic may not be visible if it is processed by hardware offloading."},"A25":{"soal":"What is traceroute used for?","opsi":{"A":"Investigating Layer 3 hops toward a destination and their response times","B":"Changing all MAC addresses","C":"Distributing DNS settings to clients","D":"Creating a binary backup"},"pembahasan":"Traceroute helps trace the Layer 3 path. A hop that does not reply does not necessarily mean it failed to forward traffic."},"B01":{"soal":"A host has IPv4 address 192.168.70.130/26. What is the network address of its subnet?","opsi":{"A":"192.168.70.64","B":"192.168.70.128","C":"192.168.70.0","D":"192.168.70.192"},"pembahasan":"A /26 subnet has blocks of 64 addresses. Address .130 falls in the .128 through .191 block, so the network address ends in .128."},"B02":{"soal":"In an IPv4 Ethernet LAN, what is the main function of ARP?","opsi":{"A":"Translate domain names into IP addresses","B":"Select the Internet default route","C":"Assign subnet masks through leases","D":"Map a neighboring IPv4 address to a MAC address"},"pembahasan":"ARP resolves a neighboring IPv4 address to a MAC address for delivery on the local link. Domain name resolution is handled by DNS."},"B03":{"soal":"Select all correct statements about managing RouterOS configurations.","opsi":{"A":"An export always contains all data and secrets without exception","B":"An .npk file is an editable configuration export","C":"An .rsc export can be inspected as text","D":"Binary backups and text exports have different purposes and coverage"},"pembahasan":"An export is a text script, while a binary backup has different characteristics and scope. Do not assume that exports contain all data or sensitive information."},"B04":{"soal":"For classic RouterOS licensing, not the CHR scheme, what is the lowest paid license level listed here that supports legacy wireless point-to-multipoint AP mode?","opsi":{"A":"Level 1","B":"All levels have identical capabilities","C":"Level 3","D":"Level 4"},"pembahasan":"Level 4 supports point-to-multipoint AP mode under classic licensing. Level 3 is intended for stations/CPEs. The hardware and wireless package must also support it."},"B05":{"soal":"A 192.168.30.0/24 LAN uses gateway 192.168.30.1 and a static server at 192.168.30.10. Which DHCP pool avoids both reserved addresses and the network and broadcast addresses?","opsi":{"A":"192.168.30.1-192.168.30.100","B":"192.168.30.10-192.168.30.255","C":"192.168.30.0-192.168.30.254","D":"192.168.30.100-192.168.30.200"},"pembahasan":"The .100 through .200 range lies inside the subnet and excludes both reserved addresses as well as the network and broadcast addresses."},"B06":{"soal":"Clients use the router's IP address as their DNS server. The router's upstream DNS works, and the firewall permits DNS requests from the LAN. Which RouterOS setting allows the router to answer client DNS queries?","opsi":{"A":"allow-remote-requests=yes","B":"add-default-route=no","C":"arp=disabled","D":"use-peer-dns=no on all interfaces"},"pembahasan":"Allow-remote-requests lets the router answer client DNS queries. Resolver access should be restricted to authorized networks."},"B07":{"soal":"On a RouterOS DHCP Client, what does use-peer-dns=yes mean?","opsi":{"A":"The router becomes an authoritative DNS server for every domain","B":"The router disables domain name resolution","C":"The router removes all static routes","D":"The router accepts DNS information supplied by the DHCP server"},"pembahasan":"Use-peer-dns permits the router to use DNS information supplied by the DHCP server. It is different from permitting the router to answer LAN client DNS queries."},"B08":{"soal":"ether2 and ether3 are members of bridge-LAN without VLANs. Where should the LAN gateway IP address serving both ports be assigned?","opsi":{"A":"bridge-LAN","B":"ether2 and ether3 separately with identical IP addresses","C":"Each client's MAC address","D":"Only the WAN interface"},"pembahasan":"The Layer 3 address for the LAN belongs on the bridge interface. Member ports provide Layer 2 connectivity to that bridge."},"B09":{"soal":"A bridge without VLANs receives a unicast frame. The destination MAC address has been learned on ether3. The frame arrives on ether2, and ether3 is in the forwarding state. What is the normal behavior?","opsi":{"A":"Send the frame to every port without exception","B":"Drop the frame because it is not broadcast","C":"Forward the frame to ether3","D":"Convert the frame into a DNS packet"},"pembahasan":"The bridge uses its MAC table to forward known unicast frames to the appropriate destination port. Flooding mainly applies to unknown destinations and certain broadcast traffic."},"B10":{"soal":"Two unicast static routes have the same destination prefix in the same routing table. Both next hops are reachable, and their distances are 1 and 5. With no other policies, which route is preferred?","opsi":{"A":"Distance 5","B":"Distance 1","C":"The one with the longest comment","D":"The one added most recently"},"pembahasan":"For route candidates with the same destination prefix, the lower distance is preferred. This differs from selecting the most-specific prefix during destination lookup."},"B11":{"soal":"A router has 192.168.45.1/24 assigned to an active, running interface. Which local network route is normally created automatically?","opsi":{"A":"A DNS route to 192.168.45.255","B":"Connected route 192.168.45.0/24","C":"A BGP route to the entire Internet","D":"A static default route to the Internet"},"pembahasan":"An address on an active interface creates a connected route to that subnet. Internet access still requires other configuration."},"B12":{"soal":"R1 already has a route to a LAN behind R2. Without NAT, request packets reach the destination host, but the host uses R2 as its gateway and R2 has no route back to the source network. What is the most relevant fix?","opsi":{"A":"Delete all routes on R1","B":"Change R1's SSID","C":"Remove the destination host's IP address","D":"Add a correct return route on R2"},"pembahasan":"Two-way communication requires a return path. A one-way route is not enough."},"B13":{"soal":"Two received signal measurements are -55 dBm and -75 dBm. Which represents the stronger signal power?","opsi":{"A":"They are equally strong because both values are negative","B":"-75 dBm","C":"They cannot be compared in dBm","D":"-55 dBm"},"pembahasan":"-55 dBm is greater than -75 dBm, so it represents stronger signal power. Link quality also depends on noise and other factors."},"B14":{"soal":"An AP operates at 5 GHz, while a client radio supports only 2.4 GHz. Even if the SSID and password match, the client ...","opsi":{"A":"Can connect if configured with a static IP","B":"Cannot connect directly to that 5 GHz radio","C":"Can connect if DHCP is disabled","D":"Automatically becomes a 5 GHz radio"},"pembahasan":"The radio must support the frequency band used by the AP. IP configuration does not change the radio's frequency capabilities."},"B15":{"soal":"In the legacy wireless package, an administrator wants to see currently registered stations and their link information on an AP. Which menu is appropriate?","opsi":{"A":"System Packages","B":"IP Routes","C":"Wireless Registration Table","D":"IP Pool"},"pembahasan":"The Registration Table shows registered wireless peers and their link statistics."},"B16":{"soal":"A router itself generates an ICMP echo-request packet toward a server on another network. Which IPv4 firewall filter chain applies to that outgoing packet?","opsi":{"A":"dstnat","B":"input","C":"output","D":"forward"},"pembahasan":"Packets originating from the router's own processes use output. Packets merely passing through the router use forward."},"B17":{"soal":"A new connection arrives at the router's public IP on TCP port 8443 and must be forwarded to LAN server 192.168.20.10 on TCP port 443. What type of translation is required?","opsi":{"A":"Source masquerade only","B":"Change only the TTL","C":"DHCP relay","D":"Destination NAT with destination port translation"},"pembahasan":"Destination NAT changes the destination to the LAN server, including its port when specified. Routing, the return path, and forward filtering must also be appropriate."},"B18":{"soal":"Select all correct statements about the RouterOS IPv4 firewall.","opsi":{"A":"connection-state=established matches packets belonging to established connections","B":"Rule order can affect processing results","C":"action=drop always sends a rejection message to the sender","D":"NAT automatically replaces every firewall filter policy"},"pembahasan":"Connection tracking identifies connection states. Rule order matters; drop does not send a rejection response like reject, and NAT does not replace filtering policies."},"B19":{"soal":"An administrator changes a NAT rule but tests using an existing connection still tracked by the router. Why might the old translation still appear?","opsi":{"A":"Connection tracking can preserve NAT mappings for existing connections","B":"The router does not support NAT","C":"NAT only works on the first day","D":"DNS always cancels new NAT rules"},"pembahasan":"NAT decisions are stored in connection tracking. Test a new connection or carefully manage the relevant connection entries; do not assume the new rule failed based only on an old connection."},"B20":{"soal":"In a queue configuration without burst, what does the max-limit parameter primarily specify?","opsi":{"A":"The minimum speed always guaranteed by the ISP","B":"The upper traffic rate limit of the queue","C":"The maximum number of DHCP clients","D":"The router's storage capacity"},"pembahasan":"Max-limit defines a queue's maximum rate, not a guarantee that bandwidth is always available. Link capacity and network conditions still constrain throughput."},"B21":{"soal":"An administrator wants a simple way to limit one client's IP upload and download rates. Which feature is the most direct fit?","opsi":{"A":"IP Neighbor Discovery","B":"Simple Queue targeting the client's IP address","C":"System Scheduler alone","D":"DHCP Relay"},"pembahasan":"Simple Queues support upload/download limiting by target. The traffic must actually traverse the relevant queue processing path."},"B22":{"soal":"What is the order of the main PPPoE phases?","opsi":{"A":"NAT then DNS","B":"ARP then HTTP","C":"Session then Discovery","D":"Discovery then Session"},"pembahasan":"In the Discovery phase, the client finds the PPPoE server and establishes the basis for a session. The Session phase then carries the PPPoE connection."},"B23":{"soal":"On a router using the local PPP user database, where do you define a PPP account's username and password for authentication?","opsi":{"A":"System Identity","B":"PPP Secret","C":"Wireless Registration Table","D":"IP Routes"},"pembahasan":"PPP Secret stores local PPP accounts, including usernames and passwords. PPP Profile defines service settings that an account can use."},"B24":{"soal":"A ping command to an IP address receives a reply. What conclusion is supported by this test?","opsi":{"A":"The destination responded to ICMP at the time of the test","B":"DNS must be configured correctly","C":"There is no packet loss on any Internet path","D":"Every application on the destination must be working"},"pembahasan":"A ping reply shows an ICMP response during that test. It does not prove that application services or DNS are working."},"B25":{"soal":"You want to save packets observed on a router for further analysis in Wireshark. Which tool is most appropriate?","opsi":{"A":"System Identity","B":"DHCP Network","C":"Packet Sniffer with capture output","D":"IP Service"},"pembahasan":"Packet Sniffer can capture packets for detailed analysis. Choose the correct interface and capture filters, and be aware of traffic visibility limits caused by hardware offloading."}}</script><script id="refs" type="application/json">{"S01": {"title": "MikroTik Training — FAQ ujian", "url": "https://mikrotik.com/training/about"}, "S02": {"title": "MTCNA Training Outline — tautan resmi pada halaman training", "url": "https://i.mt.lv/cdn/training_pdf/mtcna_outline_2019181161836.pdf"}, "S03": {"title": "First Time Configuration", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328151/First+Time+Configuration"}, "S04": {"title": "IP Addressing", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328247/IP+Addressing"}, "S05": {"title": "Configuration Management", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328155/Configuration+Management"}, "S06": {"title": "DHCP Client", "url": "https://manual.mikrotik.com/docs/network-management/dhcp/client/"}, "S07": {"title": "DHCP", "url": "https://manual.mikrotik.com/docs/network-management/dhcp/"}, "S08": {"title": "DNS", "url": "https://manual.mikrotik.com/docs/network-management/dns/"}, "S09": {"title": "Bridging and Switching", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328068/Bridging+and+Switching"}, "S10": {"title": "Spanning Tree Protocol", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/21725254/Spanning+Tree+Protocol"}, "S11": {"title": "IP Routing", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328084/IP+Routing"}, "S12": {"title": "Wireless Interface — legacy wireless", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/8978446/Wireless+Interface"}, "S13": {"title": "Wireless Station Modes", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/122388518/Wireless+Station+Modes"}, "S14": {"title": "Filter — chain input/forward/output", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/48660574/Filter"}, "S15": {"title": "NAT", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/3211299/NAT"}, "S16": {"title": "Common Firewall Matchers and Actions", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/250708064/Common+Firewall+Matchers+and+Actions"}, "S17": {"title": "Queues", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328088/Queues"}, "S18": {"title": "Connection tracking", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/130220087/Connection+tracking"}, "S19": {"title": "PPPoE", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/2031625/PPPoE"}, "S20": {"title": "EoIP", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/24805521/EoIP"}, "S21": {"title": "Torch", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/8323150/Torch"}, "S22": {"title": "Traceroute", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/130220138/Traceroute"}, "S23": {"title": "ARP", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/100892687/ARP"}, "S24": {"title": "RouterOS license keys", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/328149/RouterOS+license+keys"}, "S25": {"title": "DHCP Server", "url": "https://manual.mikrotik.com/docs/network-management/dhcp/server/"}, "S26": {"title": "Wireless", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/1409138/Wireless"}, "S27": {"title": "PPP AAA — User Database", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/132350049/PPP+AAA"}, "S28": {"title": "Ping", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/8323183/Ping"}, "S29": {"title": "Packet Sniffer", "url": "https://help.mikrotik.com/docs/spaces/ROS/pages/8323088/Packet+Sniffer"}}</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent),EN=JSON.parse(document.getElementById('bank-en').textContent),REFS=JSON.parse(document.getElementById('refs').textContent);
const INDEX=Object.fromEntries(BANK.map(q=>[q.id,q]));
function getQuestion(id,lang='id'){const q=INDEX[id];return lang==='en'?{...q,...EN[id]}:q}
const TOPICS={Dasar:'Dasar RouterOS dan IPv4',DHCP:'DHCP dan DNS',Bridge:'Bridging',Routing:'Routing',Wireless:'Wireless',Firewall:'Firewall dan NAT',QoS:'QoS / Simple Queue',Tunnel:'PPP dan Tunneling',Tools:'Tools dan Troubleshooting'};
const ORDER=[1,5,8,10,13,16,20,22,24,2,6,9,11,14,17,21,23,25,3,7,12,15,18,4,19];
const app=document.getElementById('app');let s=null,screen='home',draft=[],last=null,parentResult=null,selectionMode='tryout',chosenLanguage='id';
const LANGUAGE_NAMES={id:'Bahasa Indonesia',en:'English'};
function warning(){return '<div class="notice caution"><strong>Perhatian: latihan ini bukan soal ujian resmi</strong><p>Soal dalam simulasi ini <strong>tidak 100% sama persis</strong> dengan soal sertifikasi MTCNA yang sebenarnya.</p><p>Peserta wajib mempelajari dan memahami konsep serta praktik RouterOS, bukan hanya menghafal jawaban, agar lebih siap menghadapi sertifikasi.</p></div>'}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,value='',primary=false)=>`<button type="button" class="btn ${primary?'primary':''}" data-action="${action}" data-value="${esc(value)}">${esc(text)}</button>`;
const choice=(text,action,value='')=>`<button type="button" class="choice" data-action="${action}" data-value="${esc(value)}">${esc(text)}</button>`;
function put(html){app.innerHTML=html;const title=app.querySelector('h1,h2');if(title){title.tabIndex=-1;title.focus({preventScroll:true})}window.scrollTo(0,0)}
function home(){s=null;screen='home';document.getElementById('clock').textContent='';put(`<div class="eyebrow">Persiapan sertifikasi MTCNA</div><h1>Latihan dan tryout MTCNA</h1><p class="muted">Tersedia 50 soal dalam Bahasa Indonesia atau English. Pilih jawaban dengan tombol, tanpa mengetik.</p><div class="stack">${choice('Belajar per Topik','choose','study')}${choice('Tryout 50 Soal','choose','tryout')}${choice('Panduan','guide')}</div><p class="language-note">Rekomendasi: gunakan English untuk membiasakan diri dengan bahasa soal sertifikasi.</p><p class="muted">Mode belajar menampilkan pembahasan langsung. Tryout memiliki waktu 60 menit dan hasil persentase.</p>`)}
function topics(){screen='topics';put(`<div class="eyebrow">${LANGUAGE_NAMES[chosenLanguage]}</div><h1>Pilih topik</h1><p class="muted">Pembahasan ditampilkan setelah jawaban disimpan.</p><div class="stack">${Object.entries(TOPICS).map(([k,v])=>choice(v,'topic',k)).join('')}</div>${btn('Ganti Bahasa','choose','study')}${btn('Menu Utama','home')}`)}
function chooseLanguage(mode){selectionMode=mode;screen='languages';put(`<div class="eyebrow">${mode==='tryout'?'Tryout 50 soal':'Belajar per topik'}</div><h1>Pilih bahasa soal</h1><p>Bahasa yang dipilih berlaku untuk pertanyaan, pilihan jawaban, dan pembahasan. Kedua bahasa menggunakan <strong>50 soal yang setara</strong>.</p><div class="stack"><button type="button" class="choice language" data-action="language" data-value="en">English <span class="badge">Direkomendasikan</span><small>Disarankan karena soal sertifikasi MTCNA menggunakan bahasa Inggris.</small></button><button type="button" class="choice language" data-action="language" data-value="id">Bahasa Indonesia<small>Untuk memahami konsep, istilah, dan dasar-dasar RouterOS.</small></button></div>${warning()}<div class="nav">${btn('Menu Utama','home')}</div>`)}
function prepare(lang){screen='prepare';chosenLanguage=lang;put(`<div class="eyebrow">Bahasa soal: ${LANGUAGE_NAMES[lang]}</div><h1>Tryout MTCNA — ${LANGUAGE_NAMES[lang]}</h1><div class="notice"><p><strong>50 soal · 60 menit · Batas lulus latihan 60%</strong></p><p>Satu jawaban benar bernilai 2%. Untuk soal dengan beberapa jawaban benar, pilih semua jawaban benar tanpa opsi yang salah. Jawaban salah atau kosong bernilai 0.</p><p>Waktu berjalan setelah menekan Mulai Tryout. Jika waktu habis, jawaban tersimpan dikumpulkan otomatis. Pembahasan tersedia setelah selesai.</p></div>${warning()}<div class="nav">${btn('Mulai Tryout','start',lang,true)}${btn('Ganti Bahasa','choose','tryout')}${btn('Menu Utama','home')}</div>`)}
function start(mode,ids,label,language='id'){s={mode,ids,label,language,at:0,answers:{},marks:[],locked:[],deadline:mode==='tryout'?Date.now()+3600000:null,finished:false};last=null;question()}
function current(){return getQuestion(s.ids[s.at],s.language)}
function question(){screen='question';draft=[...(s.answers[current().id]||[])];renderQuestion()}
function renderQuestion(){const q=current(),locked=s.locked.includes(q.id),multi=q.jenis==='jamak';put(`<div class="meta"><span>${esc(s.label)} · Soal ${s.at+1} dari ${s.ids.length}</span><span>${Object.values(s.answers).filter(x=>x.length).length} tersimpan</span></div><div class="track"><div class="fill" style="width:${(s.at+1)/s.ids.length*100}%"></div></div><div class="eyebrow">${esc(TOPICS[q.topik])}</div><h2>${esc(q.soal)}</h2><p class="muted">${multi?'Pilih semua jawaban yang benar. Klik lagi untuk membatalkan pilihan.':'Pilih satu jawaban.'} Klik Simpan Jawaban agar pilihan tercatat.</p><div class="stack" role="group" aria-label="Pilihan jawaban">${Object.entries(q.opsi).map(([k,v])=>`<button type="button" class="choice option" data-action="select" data-value="${k}" aria-pressed="${draft.includes(k)}" ${locked?'disabled':''}><span class="key">${k}.</span> ${esc(v)}</button>`).join('')}</div><div class="message" role="status" id="message">${locked?'Jawaban sudah dinilai.':draft.length?'Pilihan: '+draft.join(', '):'Belum ada pilihan.'}</div>${locked?explanation(q):''}<div class="nav">${!locked?btn('Simpan Jawaban','save','',true):btn(s.at===s.ids.length-1?'Lihat Hasil':'Lanjutkan','next','',true)}${s.mode==='tryout'?(s.at>0?btn('Sebelumnya','prev'):'')+btn('Berikutnya','next')+btn(s.marks.includes(q.id)?'Hapus Tanda':'Tandai','mark')+btn('Tinjau','review')+btn('Kumpulkan','confirm'):!locked?btn('Lewati','skip'):''}</div><div class="nav">${btn('Keluar Latihan','exit')}</div>`)}
function select(k){if(s.locked.includes(current().id))return;if(current().jenis==='tunggal')draft=[k];else draft=draft.includes(k)?draft.filter(x=>x!==k):[...draft,k].sort();app.querySelectorAll('[data-action=select]').forEach(b=>b.setAttribute('aria-pressed',String(draft.includes(b.dataset.value))));document.getElementById('message').textContent=draft.length?'Pilihan: '+draft.join(', '):'Belum ada pilihan.'}
function save(skip=false){const q=current();if(s.locked.includes(q.id))return;if(!skip&&!draft.length){document.getElementById('message').textContent='Pilih jawaban terlebih dahulu, atau gunakan tombol untuk melewati soal.';return}if(skip)draft=[];s.answers[q.id]=skip?[]:[...draft].sort();if(s.mode==='tryout')next();else{s.locked.push(q.id);renderQuestion()}}
function next(){if(s.at<s.ids.length-1){s.at++;question()}else if(s.mode==='tryout')review();else finish()}
function answerText(q,a){return a?.length?a.map(k=>`${k}. ${q.opsi[k]}`).join('; '):'Belum dijawab'}
function correct(q,a){return [...(a||[])].sort().join('')===q.kunci.split('').sort().join('')}
function sourceLinks(q){return q.sumber.split(',').map(k=>REFS[k]?`<a href="${esc(REFS[k].url)}" target="_blank" rel="noopener noreferrer">${esc(REFS[k].title)}</a>`:'').join(' · ')}
function explanation(q,answers=s.answers){const a=answers[q.id]||[];return `<div class="notice"><strong>${a.length?(correct(q,a)?'Benar':'Salah'):'Belum dijawab'}</strong><p>Jawaban Anda: ${esc(answerText(q,a))}</p><p>Jawaban benar: ${esc(answerText(q,q.kunci.split('')))}</p><p>${esc(q.pembahasan)}</p><div class="sources">${sourceLinks(q)}</div></div>`}
function review(){screen='review';put(`<h1>Tinjau jawaban</h1><p class="muted">Klik nomor untuk membuka soal. Latar berwarna berarti sudah dijawab; garis tebal berarti ditandai.</p><div class="numbers">${s.ids.map((id,i)=>`<button type="button" class="num ${s.answers[id]?.length?'done':''} ${s.marks.includes(id)?'marked':''}" data-action="goto" data-value="${i}" aria-label="Soal ${i+1}, ${s.answers[id]?.length?'terjawab':'kosong'}${s.marks.includes(id)?', ditandai':''}">${i+1}</button>`).join('')}</div><div class="nav">${btn('Kumpulkan Tryout','confirm','',true)}${btn('Kembali ke Soal','question')}${btn('Keluar Latihan','exit')}</div>`)}
function confirmSubmit(){screen='confirm';const n=Object.values(s.answers).filter(x=>x.length).length;put(`<h1>Kumpulkan tryout?</h1><p>${n} soal sudah dijawab dan ${s.ids.length-n} soal masih kosong.</p><p class="muted">Setelah dikumpulkan, jawaban tidak dapat diubah. Pilihan yang belum disimpan tidak dihitung.</p><div class="nav">${btn('Ya, Kumpulkan','finish','',true)}${btn('Kembali','review')}</div>`)}
function finish(expired=false){if(!s||s.finished)return;s.finished=true;const questions=s.ids.map(id=>getQuestion(id,s.language));const right=questions.filter(q=>correct(q,s.answers[q.id])).length;const blank=questions.filter(q=>!s.answers[q.id]?.length).length;last={...structuredClone(s),right,blank,wrong:questions.length-right-blank,percent:100*right/questions.length,expired};showResult()}
function percent(n){return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')}
function topicRows(r){return Object.entries(TOPICS).map(([k,name])=>{const qs=r.ids.map(id=>getQuestion(id,r.language)).filter(q=>q.topik===k);if(!qs.length)return null;const n=qs.filter(q=>correct(q,r.answers[q.id])).length;return {k,name,n,total:qs.length,rate:100*n/qs.length}}).filter(Boolean)}
function showResult(){screen='result';const r=last,rows=topicRows(r),weak=rows.filter(x=>x.rate<100).sort((a,b)=>a.rate-b.rate).slice(0,3);document.getElementById('clock').textContent='';put(`<div class="eyebrow">${esc(r.label)}</div><h1>${r.mode==='tryout'?'Hasil Tryout MTCNA':'Hasil Latihan'}</h1><div class="muted">${r.mode==='tryout'?'Nilai akhir':'Persentase jawaban benar'}</div><div class="score" id="final-score">${percent(r.percent)}%</div><p><strong>${r.right} dari ${r.ids.length} soal dijawab benar.</strong> ${r.mode==='tryout'?(r.percent>=60?'Lulus latihan.':'Belum lulus latihan.'):'Hasil ini merupakan latihan belajar.'}</p><div class="stats"><div><strong>${r.right}</strong><span>Benar</span></div><div><strong>${r.wrong}</strong><span>Salah</span></div><div><strong>${r.blank}</strong><span>Belum dijawab</span></div></div>${r.mode==='tryout'?`<p class="muted">Batas lulus latihan: 60%. ${r.expired?'Jawaban dikumpulkan karena waktu habis.':'Jawaban dikumpulkan sebelum waktu habis.'}</p>`:''}${r.mode==='remedial'?'<p class="muted">Nilai latihan ulang tidak mengubah hasil tryout sebelumnya.</p>':''}<h3>Hasil per topik</h3><table><thead><tr><th>Topik</th><th>Benar/Total</th><th>Persentase</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}/${x.total}</td><td>${percent(x.rate)}%</td></tr>`).join('')}</tbody></table><div class="notice">${weak.length?'Pelajari kembali: '+weak.map(x=>esc(x.name)).join(', ')+'. Gunakan pembahasan dan latihan ulang untuk memahami jawaban yang belum tepat.':'Seluruh soal pada sesi ini sudah dijawab benar. Lanjutkan latihan konfigurasi dan troubleshooting di lab.'}</div><div class="nav">${btn('Tinjau Pembahasan','solutions','0',true)}${r.wrong+r.blank?btn('Latihan Ulang Kesalahan','remedial'):''}${parentResult&&r.mode==='remedial'?btn('Hasil Awal','parent'):''}${btn('Menu Utama','home')}</div>`)}
function solutions(page){screen='solutions';const r=last,ids=r.ids.slice(page*5,page*5+5);put(`<h1>Pembahasan</h1><p class="muted">${esc(r.label)} · Halaman ${page+1} dari ${Math.ceil(r.ids.length/5)}</p>${ids.map((id,i)=>{const q=getQuestion(id,r.language);return `<div class="review"><strong>Soal ${page*5+i+1}</strong><p>${esc(q.soal)}</p>${explanation(q,r.answers)}</div>`}).join('')}<div class="nav">${page?btn('Sebelumnya','solutions',page-1):''}${(page+1)*5<r.ids.length?btn('Berikutnya','solutions',page+1):''}${btn('Kembali ke Hasil','result')}</div>`)}
function guide(){screen='guide';put(`<h1>Panduan latihan</h1><p>Semua jawaban dipilih dengan mengklik tombol, tanpa mengetik.</p><div class="notice"><p><strong>Bahasa:</strong> pilih Bahasa Indonesia atau English. English direkomendasikan karena ujian sertifikasi menggunakan bahasa Inggris. Masing-masing pilihan menyediakan 50 soal yang sama dalam terjemahan berbeda.</p><p><strong>Belajar:</strong> pilih bahasa dan topik, lalu klik Simpan Jawaban untuk melihat kunci dan pembahasan.</p><p><strong>Tryout:</strong> pilih bahasa dan kerjakan 50 soal dalam 60 menit. Simpan jawaban; Anda dapat meninjau dan menggantinya sebelum mengumpulkan.</p><p><strong>Jawaban jamak:</strong> klik semua opsi yang dianggap benar. Klik lagi untuk membatalkan.</p><p><strong>Nilai:</strong> jumlah soal benar dibagi 50 kemudian dikali 100%. Contoh: 40 benar dari 50 soal memperoleh 80%.</p><p><strong>Penyimpanan:</strong> sesi hanya tersedia selama halaman dibuka. Jangan memuat ulang atau menutup halaman sebelum selesai. Soal beserta kunci ada di berkas ini, sehingga tidak cocok sebagai ujian dengan kunci rahasia.</p></div>${warning()}${btn('Menu Utama','home')}`)}
function tick(){if(!s||s.mode!=='tryout'||s.finished)return;const left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));document.getElementById('clock').textContent=`Sisa waktu ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(!left)finish(true)}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(s?.mode==='tryout'&&!s.finished&&Date.now()>=s.deadline){finish(true);return}const a=b.dataset.action,v=b.dataset.value;switch(a){case'home':home();break;case'choose':chooseLanguage(v);break;case'language':chosenLanguage=v;if(selectionMode==='tryout')prepare(v);else topics();break;case'topics':topics();break;case'start':parentResult=null;start('tryout',ORDER.flatMap(n=>['A','B'].map(p=>p+String(n).padStart(2,'0'))),'Tryout MTCNA · '+LANGUAGE_NAMES[v],v);tick();break;case'topic':parentResult=null;start('belajar',BANK.filter(q=>q.topik===v).map(q=>q.id),TOPICS[v]+' · '+LANGUAGE_NAMES[chosenLanguage],chosenLanguage);break;case'guide':guide();break;case'select':select(v);break;case'save':save();break;case'skip':save(true);break;case'next':next();break;case'prev':if(s.at>0){s.at--;question()}break;case'question':question();break;case'mark':{const id=current().id;s.marks=s.marks.includes(id)?s.marks.filter(x=>x!==id):[...s.marks,id];renderQuestion();break}case'review':review();break;case'goto':s.at=Number(v);question();break;case'confirm':confirmSubmit();break;case'finish':finish();break;case'result':showResult();break;case'solutions':solutions(Number(v));break;case'remedial':{const r=last;if(r.mode!=='remedial')parentResult=structuredClone(r);const ids=r.ids.filter(id=>!correct(getQuestion(id,r.language),r.answers[id]));start('remedial',ids,'Latihan Ulang Kesalahan · '+LANGUAGE_NAMES[r.language],r.language);break}case'parent':last=structuredClone(parentResult);s=structuredClone(last);showResult();break;case'exit':screen='exit';put(`<h1>Keluar dari latihan?</h1><p>Jawaban sesi ini akan dihapus. Jika ingin melihat nilai tryout, kembali ke soal lalu pilih Kumpulkan.</p><div class="nav">${btn('Ya, Keluar','home')}${btn('Kembali ke Soal','question','',true)}</div>`);break}});
window.addEventListener('beforeunload',e=>{if(s&&!s.finished){e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',tick);setInterval(tick,500);home();
</script></body></html>
